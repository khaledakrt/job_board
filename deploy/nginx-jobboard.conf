# Site Job Board — à placer dans /etc/nginx/sites-available/jobboard
# Remplacer par votre domaine si nécessaire.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Fichiers statiques Angular (build production)
    root /var/www/jobboard/site;
    index index.html;

    client_max_body_size 25M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers uploadés (CV, logos) servis par Express
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pages d'offres publiques avec balises SEO dynamiques (Open Graph / JSON-LD)
    location ~ "^/offres/[0-9a-fA-F-]{36}$" {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pages publiques catalogue avec balises SEO dynamiques
    location ~ "^/(entreprises|centres-formation|centres-formation/formations|centres-formation/evenements|etablissements-prives|etablissements-prives/publications)/[0-9a-fA-F-]{36}$" {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/(centres-formation|etablissements-prives)$" {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Angular — routes côté client
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Après certificat SSL (certbot) :
# sudo certbot --nginx -d votre-domaine.fr -d www.votre-domaine.fr
