<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>JobBoard — Plateforme de recrutement</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="JobBoard — recrutez et postulez sur une seule plateforme." />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K9MEVMBZ3Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-K9MEVMBZ3Z');
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      #bootstrap-error {
        display: none;
        margin: 1rem;
        padding: 1rem 1.25rem;
        border-radius: 0.75rem;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
      }
      .static-loading-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, sans-serif;
      }
      .static-loading-card {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 1rem 1.25rem;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      }
      .static-loading-logo {
        display: inline-grid;
        width: 2.25rem;
        height: 2.25rem;
        place-items: center;
        border-radius: 0.7rem;
        background: #0a66c2;
        color: #fff;
        font-weight: 800;
      }
      .static-loading-title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 800;
      }
      .static-loading-text {
        margin: 0.15rem 0 0;
        font-size: 0.85rem;
        color: #64748b;
      }
    </style>
  </head>
  <body class="bg-surface-50 text-surface-900 antialiased">
    <div id="bootstrap-error" role="alert"></div>
    <app-root>
      <div class="static-loading-screen">
        <div class="static-loading-card" role="status" aria-live="polite">
          <span class="static-loading-logo">JB</span>
          <div>
            <p class="static-loading-title">JobBoard</p>
            <p class="static-loading-text">Chargement...</p>
          </div>
        </div>
      </div>
    </app-root>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        JavaScript est requis. Activez-le ou utilisez les liens :
        <a href="/auth/register?role=candidate">Candidat</a>,
        <a href="/auth/register?role=recruiter">Recruteur</a>,
        <a href="/auth/login">Connexion</a>.
      </p>
    </noscript>
  </body>
</html>
