@if (confirmDialog.state(); as dialog) {
  <div
    class="confirm-backdrop"
    role="presentation"
    (click)="cancel()"
  ></div>
  <div
    class="confirm-dialog"
    [class.confirm-dialog-alert]="dialog.mode === 'alert'"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-title'"
    [attr.aria-describedby]="'confirm-message'"
    (click)="$event.stopPropagation()"
  >
    <h2 id="confirm-title" class="confirm-title">{{ dialog.title }}</h2>
    <p id="confirm-message" class="confirm-message">{{ dialog.message }}</p>
    <div class="confirm-actions">
      @if (dialog.mode === 'confirm') {
        <button type="button" class="btn-secondary !w-auto px-5" (click)="cancel()">
          {{ dialog.cancelLabel }}
        </button>
      }
      <button
        type="button"
        class="btn-primary !w-auto px-5"
        [class.btn-danger]="dialog.confirmDanger"
        (click)="confirm()"
      >
        {{ dialog.confirmLabel }}
      </button>
    </div>
  </div>
}
