<app-public-shell>
  <main class="catalog-page-main">
    <div class="catalog-page-inner">
      <a [routerLink]="routes.PUBLIC.TRAINING_CENTERS" class="landing-btn landing-btn-ghost">← Retour</a>
      <div class="catalog-form-panel" style="margin-top: 1rem">
        <h1 style="margin-top: 0">Publier votre centre</h1>
        <p class="catalog-card-meta">Votre fiche sera visible après validation par un administrateur.</p>

        @if (success()) {
          <div class="catalog-success" style="margin: 1rem 0">{{ success() }}</div>
        }
        @if (error()) {
          <p class="field-hint-error" style="color: #b91c1c">{{ error() }}</p>
        }

        <form (ngSubmit)="submit()">
          <div class="catalog-form-row">
            <label>Nom du centre *</label>
            <input class="catalog-input" [(ngModel)]="name" name="name" required />
          </div>
          <div class="catalog-form-row">
            <label>URL du logo (https://)</label>
            <input class="catalog-input" [(ngModel)]="logoUrl" name="logoUrl" />
          </div>
          <div class="catalog-form-row">
            <label>Description *</label>
            <textarea class="catalog-input" rows="5" [(ngModel)]="description" name="description" required></textarea>
          </div>
          <div class="catalog-form-row">
            <label>Adresse</label>
            <input class="catalog-input" [(ngModel)]="address" name="address" />
          </div>
          <div class="catalog-form-row">
            <label>Ville</label>
            <input class="catalog-input" [(ngModel)]="city" name="city" />
          </div>
          <div class="catalog-form-row">
            <label>Téléphone</label>
            <input class="catalog-input" [(ngModel)]="phone" name="phone" />
          </div>
          <div class="catalog-form-row">
            <label>Email</label>
            <input class="catalog-input" type="email" [(ngModel)]="email" name="email" />
          </div>
          <div class="catalog-form-row">
            <label>Site web</label>
            <input class="catalog-input" [(ngModel)]="website" name="website" placeholder="https://…" />
          </div>
          <div class="catalog-form-row">
            <label>Domaine de formation</label>
            <input class="catalog-input" [(ngModel)]="trainingDomain" name="trainingDomain" />
          </div>
          <div class="catalog-form-row">
            <label>Mode principal</label>
            <select class="catalog-select" [(ngModel)]="deliveryMode" name="deliveryMode">
              <option value="">—</option>
              @for (opt of deliveryOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          </div>
          <div class="catalog-form-row">
            <label>Photos (une URL https:// par ligne)</label>
            <textarea class="catalog-input" rows="3" [(ngModel)]="photoUrlsText" name="photoUrlsText"></textarea>
          </div>
          <div class="catalog-form-row">
            <label>Réseaux sociaux (une URL par ligne)</label>
            <textarea class="catalog-input" rows="2" [(ngModel)]="socialLinksText" name="socialLinksText"></textarea>
          </div>

          <h2>Formations *</h2>
          @for (course of courses; track $index) {
            <div class="catalog-repeat-block">
              <div class="catalog-form-row">
                <label>Titre</label>
                <input class="catalog-input" [(ngModel)]="course.title" [name]="'ct' + $index" required />
              </div>
              <div class="catalog-form-row">
                <label>Description</label>
                <textarea class="catalog-input" rows="2" [(ngModel)]="course.description" [name]="'cd' + $index"></textarea>
              </div>
              @if (courses.length > 1) {
                <button type="button" class="landing-btn landing-btn-ghost" (click)="removeCourse($index)">Retirer</button>
              }
            </div>
          }
          <button type="button" class="landing-btn landing-btn-ghost" (click)="addCourse()">+ Formation</button>

          <p style="margin-top: 1.25rem">
            <button type="submit" class="landing-btn landing-btn-primary" [disabled]="submitting()">
              {{ submitting() ? 'Envoi…' : 'Envoyer pour validation' }}
            </button>
          </p>
        </form>
      </div>
    </div>
  </main>
</app-public-shell>
