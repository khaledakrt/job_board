<app-public-shell>
<div class="auth-shell">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-surface-900">Forgot your password?</h1>
      <p class="mt-2 text-sm text-surface-600">
        Enter your email and we will send you reset instructions.
      </p>
    </div>

    <div class="auth-card">
      @if (authService.errorMessage()) {
        <div class="mb-4 rounded-xl border border-danger-500/30 bg-red-50 px-4 py-3 text-sm text-danger-600">
          {{ authService.errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="mb-4 rounded-xl border border-success-500/30 bg-green-50 px-4 py-3 text-sm text-success-600">
          {{ successMessage() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-6">
          <label class="form-label" for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            class="form-input"
            [class.form-input-error]="hasError()"
            placeholder="you@company.com"
          />
          @if (hasError()) {
            <p class="form-error">Enter a valid email address.</p>
          }
        </div>

        <button type="submit" class="btn-primary" [disabled]="authService.loading()">
          @if (authService.loading()) {
            Sending...
          } @else {
            Send reset link
          }
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-surface-600">
        <a [routerLink]="routes.AUTH.LOGIN" class="link-primary">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
</app-public-shell>
