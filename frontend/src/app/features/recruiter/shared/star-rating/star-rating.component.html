<div class="star-rating" role="group" aria-label="Candidate rating">
  @for (star of stars; track star) {
    <button
      type="button"
      class="star-btn"
      [class.star-active]="(rating() ?? 0) >= star"
      [disabled]="disabled()"
      (click)="setRating(star)"
      [attr.aria-label]="'Rate ' + star + ' stars'"
    >
      ★
    </button>
  }
</div>
