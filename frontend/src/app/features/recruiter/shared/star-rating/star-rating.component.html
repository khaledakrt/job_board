<div class="star-rating" role="group" aria-label="Note du candidat">
  @for (star of stars; track star) {
    <button
      type="button"
      class="star-btn"
      [class.star-active]="(rating() ?? 0) >= star"
      [disabled]="disabled()"
      (click)="setRating(star)"
      [attr.aria-label]="'Attribuer ' + star + ' étoile' + (star > 1 ? 's' : '')"
    >
      ★
    </button>
  }
</div>
