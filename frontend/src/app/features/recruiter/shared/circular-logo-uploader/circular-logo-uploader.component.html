<div class="logo-uploader">
  <button
    type="button"
    class="logo-preview"
    [class.logo-preview-drag]="dragOver()"
    [disabled]="disabled()"
    (click)="openPicker()"
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    aria-label="Téléverser le logo de l'entreprise"
  >
    @if (displayUrl()) {
      <img [src]="displayUrl()" alt="Aperçu du logo de l'entreprise" class="logo-image" />
    } @else {
      <div class="logo-placeholder">
        <span class="logo-placeholder-icon">+</span>
        <span class="logo-placeholder-text">Ajouter le logo</span>
      </div>
    }
    <span class="logo-overlay">Modifier</span>
  </button>

  <input
    #fileInput
    type="file"
    class="hidden"
    accept="image/jpeg,image/png,image/webp"
    (change)="onFileChange($event)"
  />

  <p class="logo-hint">JPG, PNG ou WEBP. Max {{ maxSizeMb() }} Mo. Aperçu au format rond.</p>

  @if (errorMessage()) {
    <p class="logo-error">{{ errorMessage() }}</p>
  }
</div>
