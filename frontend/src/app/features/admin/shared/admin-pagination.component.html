@if (pagination && pagination.totalItems > 0) {
  <nav class="admin-pagination-bar" [class.admin-pagination-bar--compact]="compact" [attr.aria-label]="'Pagination ' + itemLabel">
    <p class="admin-pagination-summary">{{ summary() }}</p>

    <div class="admin-pagination-controls">
      <button
        type="button"
        class="admin-pagination-btn"
        [disabled]="!pagination.hasPreviousPage || loading"
        (click)="goTo(pagination.page - 1)"
      >
        ← Précédent
      </button>

      <div class="admin-pagination-pages">
        @for (token of pageTokens(); track $index) {
          @if (token === 'gap') {
            <span class="admin-pagination-gap" aria-hidden="true">…</span>
          } @else {
            <button
              type="button"
              class="admin-pagination-page"
              [class.admin-pagination-page--active]="pagination.page === token"
              [disabled]="loading"
              (click)="goTo(token)"
            >
              {{ token }}
            </button>
          }
        }
      </div>

      <button
        type="button"
        class="admin-pagination-btn"
        [disabled]="!pagination.hasNextPage || loading"
        (click)="goTo(pagination.page + 1)"
      >
        Suivant →
      </button>
    </div>
  </nav>
}
