<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">A</div>
      <div>
        <p class="brand-title">Administration</p>
        <p class="brand-sub">Job Board</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      @for (section of navSections; track section.label) {
        <div class="nav-section">
          <p class="nav-section-label">{{ section.label }}</p>
          @for (item of section.items; track item.label) {
            <a
              [routerLink]="item.route"
              [queryParams]="item.queryParams"
              routerLinkActive="nav-active"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              class="nav-link"
            >
              <span class="nav-label">{{ item.label }}</span>
              @if (item.badge) {
                <span class="nav-badge">{{ item.badge }}</span>
              }
            </a>
          }
        </div>
      }
    </nav>

    <div class="sidebar-footer">
      @if (authService.user()) {
        <p class="sidebar-user">{{ authService.user()!.email }}</p>
      }
      <a [routerLink]="routes.HOME" class="nav-link">
        <span class="nav-label">Accueil public</span>
      </a>
      <button type="button" class="nav-link logout-btn" (click)="logout()">
        <span class="nav-label">Déconnexion</span>
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <router-outlet />
  </main>
</div>
