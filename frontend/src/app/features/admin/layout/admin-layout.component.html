<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">A</div>
      <div>
        <p class="brand-title">Administration</p>
        <p class="brand-sub">Job Board</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a
        [routerLink]="routes.ADMIN.DASHBOARD"
        routerLinkActive="nav-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        Tableau de bord
      </a>
      <a
        [routerLink]="routes.ADMIN.USERS"
        routerLinkActive="nav-active"
        class="nav-link"
      >
        Utilisateurs
      </a>
      <a
        [routerLink]="routes.ADMIN.JOBS"
        routerLinkActive="nav-active"
        class="nav-link"
      >
        Offres
      </a>
    </nav>

    <div class="sidebar-footer">
      @if (authService.user()) {
        <p class="sidebar-user">{{ authService.user()!.email }}</p>
      }
      <a [routerLink]="routes.HOME" class="nav-link">Accueil public</a>
      <button type="button" class="nav-link logout-btn" (click)="logout()">Déconnexion</button>
    </div>
  </aside>

  <main class="admin-main">
    <router-outlet />
  </main>
</div>
